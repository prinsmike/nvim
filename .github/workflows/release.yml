name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require a CHANGELOG entry for the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          num=${VERSION#v}
          notes="$(awk -v ver="$num" '
            $0 ~ "^## \\[" ver "\\]"     { flag=1; next }
            flag && /^## \[/             { exit }
            flag && /^\[[^][]+\]:[ \t]/  { exit }
            flag                        { print }
          ' CHANGELOG.md | sed -e '/./,$!d')"
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md entry '## [${num}]' for tag ${VERSION}. Add one before tagging."
            exit 1
          fi
          echo "Found CHANGELOG entry for ${num}."

  release:
    needs: verify-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          num=${VERSION#v}
          file="$(mktemp)"
          # Print the body of the "## [<version>]" section, stopping at the next section.
          awk -v ver="$num" '
            $0 ~ "^## \\[" ver "\\]"     { flag=1; next }
            flag && /^## \[/             { exit }
            flag && /^\[[^][]+\]:[ \t]/  { exit }
            flag                        { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba}' > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file "$NOTES_FILE"
          fi
